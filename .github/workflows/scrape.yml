name: Daily Fanqie Rank Scraper

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-rank-writes-main
  cancel-in-progress: false

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）触发
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
        fetch-depth: 0

    - name: Sync Latest Main
      run: git pull --ff-only origin main

    - name: Check today's rank files
      id: check_data
      run: |
        TODAY=$(date -u +"%Y%m%d")
        NEW_FILE="data/fanqie_female_new_ranks_${TODAY}.json"
        READING_FILE="data/fanqie_female_reading_ranks_${TODAY}.json"
        [ -f "$NEW_FILE" ] && echo "new_exists=true" >> $GITHUB_OUTPUT || echo "new_exists=false" >> $GITHUB_OUTPUT
        [ -f "$READING_FILE" ] && echo "reading_exists=true" >> $GITHUB_OUTPUT || echo "reading_exists=false" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install openai
        if [ "${{ steps.check_data.outputs.new_exists }}" = "false" ] || [ "${{ steps.check_data.outputs.reading_exists }}" = "false" ]; then
          playwright install --with-deps chromium
        fi

    - name: Validate Reading Pipeline
      run: python scripts/test_reading_pipeline.py

    - name: Run New Book Rank Scraper
      if: steps.check_data.outputs.new_exists == 'false'
      run: python scrape_fanqie_ranks.py
      env:
        GITHUB_ACTIONS: true

    - name: Run Reading Rank Scraper
      if: steps.check_data.outputs.reading_exists == 'false'
      run: python scrape_fanqie_reading_ranks.py
      env:
        GITHUB_ACTIONS: true

    - name: Build New Book Rank Data
      run: python scripts/build_latest.py
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Build Reading Rank Data
      run: python scripts/build_reading_latest.py

    - name: Build Cross Analysis
      run: python scripts/build_cross_analysis.py

    - name: Sync Latest Main Before Commit
      run: git pull --rebase --autostash origin main

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "[Auto] Update Fanqie new and reading ranks"
        file_pattern: data api
        branch: main

    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
